<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340">
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111923"/><stop offset="1" stop-color="#080d13"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .mono{font-family:ui-monospace,Menlo,monospace}.smoke{font-family:ui-monospace,Menlo,monospace;font-size:28px;font-weight:700;fill:#f1f5f9}
 .puff{fill:#d9e1e5;opacity:.0}
 #msg1{animation:show1 12s infinite} #msg2{animation:show2 12s infinite}
 #armDown{animation:armDown 12s infinite} #armUp{animation:armUp 12s infinite}
 #cloud1{animation:cloud1 12s infinite} #cloud2{animation:cloud2 12s infinite}
 @keyframes show1{0%,22%{opacity:0}25%,42%{opacity:1}48%,100%{opacity:0}}
 @keyframes show2{0%,61%{opacity:0}65%,86%{opacity:1}92%,100%{opacity:0}}
 @keyframes armUp{0%,9%,20%,48%,58%,90%,100%{opacity:0}11%,18%,62%,84%{opacity:1}}
 @keyframes armDown{0%,10%,19%,49%,59%,91%,100%{opacity:1}11%,18%,62%,84%{opacity:0}}
 @keyframes cloud1{0%,22%{opacity:0;transform:translateY(16px)}26%,42%{opacity:1;transform:translateY(0)}48%,100%{opacity:0}}
 @keyframes cloud2{0%,61%{opacity:0;transform:translateY(16px)}66%,86%{opacity:1;transform:translateY(0)}92%,100%{opacity:0}}
 </style>
</defs>
<rect width="960" height="340" rx="22" fill="url(#bg)"/>
<path d="M28 300H932" stroke="#314252" stroke-width="3"/>
<text x="42" y="38" class="mono" font-size="17" fill="#4ade80">$ ./late-night-session</text>
<!-- desk -->
<rect x="670" y="218" width="190" height="8" rx="4" fill="#405162"/>
<path d="M720 215l10-94h110l12 94" fill="#1c2938" stroke="#61788b" stroke-width="3"/>
<rect x="742" y="135" width="86" height="62" rx="5" fill="#07111b" stroke="#4ade80" stroke-width="2"/>
<text x="759" y="174" class="mono" font-size="25" fill="#4ade80">&lt;/&gt;</text>
<!-- cartoon body -->
<path d="M180 300q5-105 86-125q90-18 135 125" fill="#202d42" stroke="#52647b" stroke-width="4"/>
<path d="M228 220q-50 10-68 80" stroke="#b87958" stroke-width="24" stroke-linecap="round" fill="none"/>
<path d="M335 217q40 20 48 67" stroke="#b87958" stroke-width="24" stroke-linecap="round" fill="none" id="armDown"/>
<path d="M335 217q48-30 23-78" stroke="#b87958" stroke-width="24" stroke-linecap="round" fill="none" id="armUp"/>
<circle cx="302" cy="132" r="66" fill="#b87958" stroke="#7b4e3d" stroke-width="4"/>
<path d="M239 124q-6-78 65-82q72 2 75 75l-26-28-19 20-26-27-29 30-22-8z" fill="#17191f"/>
<path d="M275 139q12-9 24 0m21 0q12-9 24 0" stroke="#3a2925" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M294 163q14 11 28 0" stroke="#71463a" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M350 130l25-5" stroke="#e5e7eb" stroke-width="4" stroke-linecap="round"/>
<circle cx="377" cy="124" r="4" fill="#fb6542" filter="url(#glow)"/>
<!-- smoke clouds -->
<g id="cloud1"><path d="M430 75q-8-30 28-34q10-37 57-20q31-27 58 0q40-13 51 23q40 4 32 42q-3 29-43 29H464q-37-1-34-40" fill="#d9e1e5"/><text x="535" y="76" text-anchor="middle" class="smoke">Hii, I'm Naveen</text></g>
<g id="cloud2"><path d="M420 78q-8-30 28-34q10-37 57-20q31-27 58 0q40-13 51 23q40 4 32 42q-3 29-43 29H454q-37-1-34-40" fill="#d9e1e5"/><text x="533" y="65" text-anchor="middle" class="smoke" font-size="24">I may be slow</text><text x="533" y="96" text-anchor="middle" class="smoke" font-size="24">to reply</text></g>
<text x="42" y="328" class="mono" font-size="14" fill="#8ca2b5">BUILD  •  LEARN  •  COMMIT  •  REPEAT</text>
</svg>