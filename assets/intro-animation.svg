<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Animated cartoon developer with two smoke messages">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101821"/><stop offset="1" stop-color="#070b10"/></linearGradient>
 <linearGradient id="shirt" x2="0" y2="1"><stop stop-color="#384a63"/><stop offset="1" stop-color="#182536"/></linearGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
 .message{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;font-size:32px;letter-spacing:.3px;fill:#e8fff0;opacity:0}
 #msg1{animation:m1 10s infinite} #msg2{animation:m2 10s infinite}
 #armRest{animation:armRest 10s infinite} #armLift{animation:armLift 10s infinite}
 #cigRest{animation:cigRest 10s infinite} #cigToMouth{animation:cigToMouth 10s infinite}
 #embers{animation:ember 10s infinite}
 #smoke1{animation:s1 10s infinite} #smoke2{animation:s2 10s infinite}
 @keyframes armLift{0%,8%,30%,55%,100%{opacity:0}10%,26%,58%,76%{opacity:1}}
 @keyframes armRest{0%,8%,30%,55%,100%{opacity:1}10%,26%,58%,76%{opacity:0}}
 @keyframes cigToMouth{0%,8%,30%,55%,100%{opacity:0}10%,26%,58%,76%{opacity:1}}
 @keyframes cigRest{0%,8%,30%,55%,100%{opacity:1}10%,26%,58%,76%{opacity:0}}
 @keyframes ember{0%,12%,21%,60%,69%{opacity:.15}14%,18%,62%,66%{opacity:1}100%{opacity:.15}}
 @keyframes m1{0%,14%{opacity:0}18%,29%{opacity:1}36%,100%{opacity:0}}
 @keyframes m2{0%,61%{opacity:0}66%,77%{opacity:1}84%,100%{opacity:0}}
 @keyframes s1{0%,13%{opacity:0;transform:translateY(9px)}18%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0}}
 @keyframes s2{0%,61%{opacity:0;transform:translateY(9px)}66%,78%{opacity:1;transform:translateY(0)}84%,100%{opacity:0}}
 </style>
</defs>
<rect width="1000" height="360" rx="20" fill="url(#bg)"/>
<path d="M0 318H1000" stroke="#263747" stroke-width="2"/>
<g opacity=".22" stroke="#4ade80" fill="none"><path d="M30 35h90v52H30zM42 51l12 8-12 8m19-8h35"/><path d="M900 50h60v38h-60zM912 64h35m-35 10h23"/></g>
<text x="40" y="42" class="mono" font-size="16" fill="#4ade80">$ ./naveen --intro</text>
<!-- desk, laptop and mug -->
<path d="M70 288H930" stroke="#43566a" stroke-width="8" stroke-linecap="round"/>
<path d="M690 284l14-90h150l14 90" fill="#1b2938" stroke="#60758b" stroke-width="3"/>
<rect x="718" y="205" width="120" height="63" rx="7" fill="#07111a" stroke="#4ade80" stroke-width="2"/>
<text x="739" y="245" class="mono" font-size="25" fill="#4ade80">&lt;/&gt;_</text>
<path d="M875 281h50v-41q0-8-8-8h-34q-8 0-8 8z" fill="#172333" stroke="#8999a9" stroke-width="2"/>
<path d="M925 245q25-3 18 18q-5 13-18 8" fill="none" stroke="#8999a9" stroke-width="4"/>
<!-- character torso -->
<path d="M180 318q0-107 76-133q87-31 150 9q45 32 56 124z" fill="url(#shirt)" stroke="#657b93" stroke-width="4"/>
<path d="M261 204l-5 66 62 48 52-48-8-67" fill="#d4dbe2" opacity=".9"/>
<!-- neck -->
<path d="M292 177h57v47q-25 24-57 0z" fill="#a96f51"/>
<!-- head -->
<ellipse cx="322" cy="132" rx="73" ry="82" fill="#bd8463" stroke="#7b5140" stroke-width="3"/>
<!-- hair -->
<path d="M252 135q-20-92 67-111q72-13 92 51q10 29-4 67l-16-44-17-20-27 20-22-26-28 21-22-4z" fill="#15171d"/>
<path d="M252 117q-19 4-17 30q1 17 14 23l7-29m145-30q20 9 14 32q-4 16-18 22" fill="#15171d"/>
<!-- face expression -->
<path d="M285 139q13-8 26 0m28 0q13-8 26 0" fill="none" stroke="#3a2a27" stroke-width="4" stroke-linecap="round"/>
<path d="M326 144l-5 17 10 3" fill="none" stroke="#87543f" stroke-width="3" stroke-linecap="round"/>
<path d="M307 178q16 11 32 0" fill="none" stroke="#713f39" stroke-width="4" stroke-linecap="round"/>
<!-- hand resting at side -->
<path id="armRest" d="M381 220q31 35 34 79" fill="none" stroke="#bd8463" stroke-width="24" stroke-linecap="round"/>
<path id="handRest" d="M416 292q-4 18 8 24" fill="none" stroke="#bd8463" stroke-width="22" stroke-linecap="round"/>
<!-- lifted arm -->
<g id="armLift">
 <path d="M380 220q45-8 32-58q-4-16-27-30" fill="none" stroke="#bd8463" stroke-width="24" stroke-linecap="round"/>
 <path d="M382 132q-10-9-19-2" fill="none" stroke="#bd8463" stroke-width="20" stroke-linecap="round"/>
</g>
<!-- cigarettes: clearly moves with hand -->
<g id="cigRest" transform="translate(423 306) rotate(-62)">
 <rect x="-2" y="-17" width="5" height="35" rx="2" fill="#f4eee2"/><rect x="-2" y="-17" width="5" height="7" fill="#e65a4f"/>
</g>
<g id="cigToMouth" transform="translate(378 132) rotate(-8)">
 <rect x="-2" y="-19" width="5" height="38" rx="2" fill="#f4eee2"/><rect x="-2" y="-19" width="5" height="8" fill="#e65a4f"/>
</g>
<circle id="embers" cx="381" cy="115" r="5" fill="#ff624d" filter="url(#soft)"/>
<!-- smoke is animated text, not a speech cloud -->
<g id="smoke1"><path d="M395 107q38-8 62-30q28-28 61-18" fill="none" stroke="#dce8e3" stroke-width="3" opacity=".55" stroke-linecap="round"/><text class="message" x="510" y="80">Hii, I'm Naveen</text></g>
<g id="smoke2"><path d="M395 107q38-8 62-30q28-28 61-18" fill="none" stroke="#dce8e3" stroke-width="3" opacity=".55" stroke-linecap="round"/><text class="message" x="510" y="80">I may be slow to reply</text></g>
<text id="msg1" class="message" x="510" y="80">Hii, I'm Naveen</text>
<text id="msg2" class="message" x="510" y="80">I may be slow to reply</text>
<text x="40" y="345" class="mono" font-size="14" fill="#7890a4">OPEN SOURCE ENTHUSIAST</text>
</svg>