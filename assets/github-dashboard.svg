<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">Naveen's animated GitHub dashboard</title>
<desc id="desc">Animated GitHub profile statistics in GitHub's dark and green palette.</desc>
<defs>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56d364"/><stop offset="1" stop-color="#238636"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .panel{fill:#161b22;stroke:#30363d;stroke-width:1.4}
    .muted{fill:#8b949e;font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}
    .value{fill:#f0f6fc;font:700 40px 'Segoe UI',Arial,sans-serif}
    .small{fill:#c9d1d9;font:13px 'Segoe UI',Arial,sans-serif}
    .heading{fill:#f0f6fc;font:700 22px 'Segoe UI',Arial,sans-serif}
    .appear{opacity:0;transform:translateY(12px);animation:appear .75s ease-out forwards}
    @keyframes appear{to{opacity:1;transform:translateY(0)}}
    .ring{stroke-dasharray:188.5;stroke-dashoffset:188.5;animation:ring 1.7s ease-out forwards}
    @keyframes ring{to{stroke-dashoffset:0}}
    .pulse{transform-origin:center;animation:pulse 2.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
  </style>
</defs>
<rect width="960" height="500" rx="22" fill="#0d1117"/>
<rect x="1" y="1" width="958" height="498" rx="21" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
<circle cx="875" cy="40" r="125" fill="#238636" opacity=".08"/>
<circle cx="60" cy="470" r="120" fill="#3fb950" opacity=".035"/>
<text x="38" y="40" fill="#3fb950" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">NAVEEN KARTHIKEYAN E</text>
<text x="38" y="76" class="heading" font-size="27">GitHub activity dashboard</text>
<text x="920" y="42" text-anchor="end" class="muted">Updated 2026-11-19 07:56 UTC</text>
<g class="appear" style="animation-delay:.15s">
 <rect class="panel" x="28" y="105" width="212" height="142" rx="15"/>
 <text class="muted" x="48" y="137">PUBLIC REPOSITORIES</text>
 <text class="value" x="48" y="190">7</text>
 <text class="small" x="48" y="219">Projects on GitHub</text>
 <circle cx="205" cy="181" r="24" fill="none" stroke="#30363d" stroke-width="7"/>
 <circle cx="205" cy="181" r="24" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 205 181)" class="ring" filter="url(#glow)"/>
 <circle cx="205" cy="181" r="4" fill="#aff5b4" class="pulse"/>
</g>
<g class="appear" style="animation-delay:.5s">
 <rect class="panel" x="263" y="105" width="212" height="142" rx="15"/>
 <text class="muted" x="283" y="137">STARS EARNED</text>
 <text class="value" x="283" y="190">0</text>
 <text class="small" x="283" y="219">Across original public repos</text>
 <circle cx="440" cy="181" r="24" fill="none" stroke="#30363d" stroke-width="7"/>
 <circle cx="440" cy="181" r="24" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 440 181)" class="ring" style="animation-delay:.35s" filter="url(#glow)"/>
 <circle cx="440" cy="181" r="4" fill="#aff5b4" class="pulse"/>
</g>
<g class="appear" style="animation-delay:.85s">
 <rect class="panel" x="498" y="105" width="212" height="142" rx="15"/>
 <text class="muted" x="518" y="137">FOLLOWERS</text>
 <text class="value" x="518" y="190">21</text>
 <text class="small" x="518" y="219">People following your work</text>
 <circle cx="675" cy="181" r="24" fill="none" stroke="#30363d" stroke-width="7"/>
 <circle cx="675" cy="181" r="24" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 675 181)" class="ring" style="animation-delay:.7s" filter="url(#glow)"/>
 <circle cx="675" cy="181" r="4" fill="#aff5b4" class="pulse"/>
</g>
<g class="appear" style="animation-delay:1.2s">
 <rect class="panel" x="733" y="105" width="199" height="142" rx="15"/>
 <text class="muted" x="753" y="137">MERGED PRs</text>
 <text class="value" x="753" y="190">3</text>
 <text class="small" x="753" y="219">Open-source contributions</text>
 <circle cx="897" cy="181" r="24" fill="none" stroke="#30363d" stroke-width="7"/>
 <circle cx="897" cy="181" r="24" fill="none" stroke="url(#green)" stroke-width="7" stroke-linecap="round" transform="rotate(-90 897 181)" class="ring" style="animation-delay:1.05s" filter="url(#glow)"/>
 <circle cx="897" cy="181" r="4" fill="#aff5b4" class="pulse"/>
</g>
<g class="appear" style="animation-delay:1.55s">
 <rect class="panel" x="28" y="270" width="430" height="195" rx="16"/>
 <text class="heading" x="54" y="308">Pull request milestones</text>
 <text class="small" x="54" y="333">Your public and verified private PR activity</text>
 <circle cx="160" cy="400" r="49" fill="none" stroke="#30363d" stroke-width="13"/>
 <circle cx="160" cy="400" r="49" fill="none" stroke="#3fb950" stroke-width="13" stroke-linecap="round" stroke-dasharray="308" stroke-dashoffset="308" transform="rotate(-90 160 400)" class="ring" style="animation-delay:1.8s" filter="url(#glow)"/>
 <text x="160" y="405" text-anchor="middle" fill="#f0f6fc" font-size="31" font-weight="700">3</text>
 <text x="160" y="438" text-anchor="middle" class="small">opened</text>
 <circle cx="335" cy="400" r="49" fill="none" stroke="#30363d" stroke-width="13"/>
 <circle cx="335" cy="400" r="49" fill="none" stroke="#56d364" stroke-width="13" stroke-linecap="round" stroke-dasharray="308" stroke-dashoffset="308" transform="rotate(-90 335 400)" class="ring" style="animation-delay:2.1s" filter="url(#glow)"/>
 <text x="335" y="405" text-anchor="middle" fill="#f0f6fc" font-size="31" font-weight="700">3</text>
 <text x="335" y="438" text-anchor="middle" class="small">merged</text>
</g>
<g class="appear" style="animation-delay:1.9s">
 <rect class="panel" x="480" y="270" width="452" height="195" rx="16"/>
 <text class="heading" x="506" y="308">Open-source footprint</text>
 <text class="small" x="506" y="333">A snapshot of your work across GitHub</text>
 <text class="muted" x="506" y="372">PUBLIC REPOSITORIES</text>
 <rect x="506" y="383" width="394" height="9" rx="4.5" fill="#30363d"/>
 <rect x="506" y="383" width="0" height="9" rx="4.5" fill="url(#green)"><animate attributeName="width" from="0" to="394" dur="1.3s" begin="2.2s" fill="freeze"/></rect>
 <g fill="url(#green)">
  <rect class="bar" x="506" y="417" width="20" height="25" rx="4" style="animation-delay:2.15s"/>
  <rect class="bar" x="535" y="405" width="20" height="37" rx="4" style="animation-delay:2.22s"/>
  <rect class="bar" x="564" y="412" width="20" height="30" rx="4" style="animation-delay:2.29s"/>
  <rect class="bar" x="593" y="396" width="20" height="46" rx="4" style="animation-delay:2.36s"/>
  <rect class="bar" x="622" y="408" width="20" height="34" rx="4" style="animation-delay:2.43s"/>
  <rect class="bar" x="651" y="391" width="20" height="51" rx="4" style="animation-delay:2.5s"/>
  <rect class="bar" x="680" y="401" width="20" height="41" rx="4" style="animation-delay:2.57s"/>
 </g>
 <text class="small" x="725" y="426">Updated 2026-11-19 07:56 UTC</text>
</g>
<text x="38" y="486" fill="#8b949e" font-family="Segoe UI,Arial,sans-serif" font-size="11">github.com/naveen-elayaraja  •  GitHub dark + contribution green</text>
</svg>