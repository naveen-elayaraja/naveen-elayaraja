<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
<title id="title">Naveen's animated GitHub dashboard</title>
<desc id="desc">Animated GitHub profile metrics showing six public repositories, nineteen followers, one pull request opened, and zero merged pull requests.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a38"/><stop offset="1" stop-color="#102c46"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#62e5d4"/><stop offset="1" stop-color="#4b8cff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8b7bff"/><stop offset="1" stop-color="#ec70d7"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .card{fill:#172344;stroke:#34466f;stroke-width:1.2}
    .muted{fill:#94a5ca;font:600 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px}
    .value{fill:#f2f5ff;font:700 43px 'Segoe UI',Arial,sans-serif}
    .small{fill:#b8c5e3;font:13px 'Segoe UI',Arial,sans-serif}
    .heading{fill:#f2f5ff;font:700 21px 'Segoe UI',Arial,sans-serif}
    .appear{opacity:0;transform:translateY(12px);animation:appear .8s ease-out forwards}
    @keyframes appear{to{opacity:1;transform:translateY(0)}}
    .sweep{stroke-dasharray:188.5;stroke-dashoffset:188.5;animation:sweep 1.8s ease-out forwards}
    @keyframes sweep{to{stroke-dashoffset:0}}
    .pulse{transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .75s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleY(1)}}
  </style>
</defs>
<rect width="960" height="560" rx="24" fill="#0b1224"/>
<rect x="1" y="1" width="958" height="558" rx="23" fill="url(#bg)" stroke="#314366" stroke-width="2"/>
<circle cx="900" cy="35" r="120" fill="#4b65b8" opacity=".08"/>
<circle cx="80" cy="500" r="150" fill="#35c9c2" opacity=".05"/>
<text x="42" y="42" fill="#70c9ff" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">NAVEEN KARTHIKEYAN E</text>
<text x="42" y="78" class="heading" font-size="27">GitHub activity dashboard</text>
<text x="918" y="45" text-anchor="end" class="muted">PROFILE SNAPSHOT</text>
<g class="appear" style="animation-delay:.15s">
  <rect class="card" x="32" y="105" width="282" height="150" rx="18"/>
  <text class="muted" x="56" y="139">PUBLIC REPOSITORIES</text>
  <text class="value" x="56" y="198">{{PUBLIC_REPOS}}</text>
  <text class="small" x="56" y="226">Projects on GitHub</text>
  <circle cx="256" cy="179" r="34" fill="none" stroke="#2b3b61" stroke-width="9"/>
  <circle cx="256" cy="179" r="34" fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 256 179)" class="sweep" filter="url(#glow)"/>
  <circle cx="256" cy="179" r="5" fill="#eaf7ff" class="pulse"/>
</g>
<g class="appear" style="animation-delay:.55s">
  <rect class="card" x="339" y="105" width="282" height="150" rx="18"/>
  <text class="muted" x="363" y="139">FOLLOWERS</text>
  <text class="value" x="363" y="198">{{FOLLOWERS}}</text>
  <text class="small" x="363" y="226">People following your work</text>
  <circle cx="563" cy="179" r="34" fill="none" stroke="#2b3b61" stroke-width="9"/>
  <circle cx="563" cy="179" r="34" fill="none" stroke="url(#violet)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 563 179)" class="sweep" style="animation-delay:.45s" filter="url(#glow)"/>
  <circle cx="563" cy="179" r="5" fill="#eaf7ff" class="pulse"/>
</g>
<g class="appear" style="animation-delay:.95s">
  <rect class="card" x="646" y="105" width="282" height="150" rx="18"/>
  <text class="muted" x="670" y="139">PULL REQUESTS OPENED</text>
  <text class="value" x="670" y="198">{{PRS_OPENED}}</text>
  <text class="small" x="670" y="226">Across public repositories</text>
  <circle cx="870" cy="179" r="34" fill="none" stroke="#2b3b61" stroke-width="9"/>
  <circle cx="870" cy="179" r="34" fill="none" stroke="url(#cyan)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 870 179)" class="sweep" style="animation-delay:.85s" filter="url(#glow)"/>
  <circle cx="870" cy="179" r="5" fill="#eaf7ff" class="pulse"/>
</g>
<g class="appear" style="animation-delay:1.4s">
  <rect class="card" x="32" y="278" width="438" height="242" rx="18"/>
  <text class="heading" x="58" y="316">Pull request activity</text>
  <text class="small" x="58" y="341">Your public contributions to open source</text>
  <circle cx="166" cy="431" r="62" fill="none" stroke="#2b3b61" stroke-width="16"/>
  <circle cx="166" cy="431" r="62" fill="none" stroke="#63e0d0" stroke-width="16" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390" transform="rotate(-90 166 431)" class="sweep" style="animation-delay:1.6s"/>
  <text x="166" y="427" text-anchor="middle" fill="#f2f5ff" font-size="35" font-weight="700">{{PRS_OPENED}}</text>
  <text x="166" y="449" text-anchor="middle" class="small">opened</text>
  <circle cx="332" cy="431" r="62" fill="none" stroke="#2b3b61" stroke-width="16"/>
  <circle cx="332" cy="431" r="62" fill="none" stroke="#9a83ff" stroke-width="16" stroke-linecap="round" stroke-dasharray="390" stroke-dashoffset="390" transform="rotate(-90 332 431)" class="sweep" style="animation-delay:1.9s"/>
  <text x="332" y="427" text-anchor="middle" fill="#f2f5ff" font-size="35" font-weight="700">{{PRS_MERGED}}</text>
  <text x="332" y="449" text-anchor="middle" class="small">merged</text>
</g>
<g class="appear" style="animation-delay:1.8s">
  <rect class="card" x="494" y="278" width="434" height="242" rx="18"/>
  <text class="heading" x="520" y="316">Open-source journey</text>
  <text class="small" x="520" y="341">A growing collection of work and learning</text>
  <text class="muted" x="520" y="388">PUBLIC REPOSITORIES</text>
  <g fill="url(#cyan)">
    <rect class="bar" x="520" y="408" width="24" height="58" rx="5" style="animation-delay:2s"/>
    <rect class="bar" x="555" y="397" width="24" height="69" rx="5" style="animation-delay:2.08s"/>
    <rect class="bar" x="590" y="382" width="24" height="84" rx="5" style="animation-delay:2.16s"/>
    <rect class="bar" x="625" y="405" width="24" height="61" rx="5" style="animation-delay:2.24s"/>
    <rect class="bar" x="660" y="371" width="24" height="95" rx="5" style="animation-delay:2.32s"/>
    <rect class="bar" x="695" y="390" width="24" height="76" rx="5" style="animation-delay:2.4s"/>
  </g>
  <text class="small" x="520" y="490">{{PUBLIC_REPOS}} public repositories</text>
  <rect x="520" y="502" width="370" height="5" rx="2.5" fill="#2b3b61"/>
  <rect x="520" y="502" width="0" height="5" rx="2.5" fill="#63e0d0"><animate attributeName="width" from="0" to="370" dur="1.2s" begin="2.2s" fill="freeze"/></rect>
</g>
<text x="42" y="545" fill="#7f92ba" font-family="Segoe UI,Arial,sans-serif" font-size="11">github.com/naveen-elayaraja  •  Public GitHub data</text>
</svg>