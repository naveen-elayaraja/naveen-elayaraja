<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d">
<title id="t">Naveen — late-night commits</title>
<desc id="d">A flat cartoon in the style of the supplied reference: a standing young man in a grey shirt and blue trousers, turned slightly sideways, holding a closed silver MacBook with an Apple logo in one hand and a cigarette in the other. He takes two puffs; each puff reveals a message. Eight small rats run along the floor.</desc>
<defs>
 <linearGradient id="night" x2="0" y2="1"><stop stop-color="#101d29"/><stop offset="1" stop-color="#071019"/></linearGradient>
 <linearGradient id="shirt" x2="1" y2="1"><stop stop-color="#aaa9a5"/><stop offset="1" stop-color="#777b7c"/></linearGradient>
 <style>
  .ink{stroke:#252b32;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .msg{font:700 35px ui-monospace,monospace;fill:#f3f0e9;letter-spacing:-1px}
  .small{font:15px ui-monospace,monospace;fill:#81a0b4}
  #cigarm{transform-box:view-box;transform-origin:472px 203px;animation:raise 9s ease-in-out infinite}
  @keyframes raise{0%,8%,31%,55%,78%,100%{transform:rotate(0)}13%,26%,60%,73%{transform:rotate(136deg)}}
  #smoke1{animation:smoke1 9s infinite}
  #smoke2{animation:smoke2 9s infinite}
  @keyframes smoke1{0%,15%{opacity:0;transform:translateY(12px)}19%,29%{opacity:1;transform:translateY(0)}34%,100%{opacity:0}}
  @keyframes smoke2{0%,62%{opacity:0;transform:translateY(12px)}66%,76%{opacity:1;transform:translateY(0)}82%,100%{opacity:0}}
  .rat{fill:#747d86;stroke:#c1c7cc;stroke-width:1.5}
  .tail{fill:none;stroke:#c1c7cc;stroke-width:2;stroke-linecap:round}
  .r1{animation:run1 7s linear infinite}.r2{animation:run2 6.2s linear infinite}.r3{animation:run3 7.8s linear infinite}.r4{animation:run4 6.7s linear infinite}.r5{animation:run5 7.3s linear infinite}.r6{animation:run6 6.5s linear infinite}.r7{animation:run7 7.6s linear infinite}.r8{animation:run8 6.9s linear infinite}
  @keyframes run1{from{transform:translateX(-100px)}to{transform:translateX(1300px)}}
  @keyframes run2{from{transform:translateX(-280px)}to{transform:translateX(1220px)}}
  @keyframes run3{from{transform:translateX(-460px)}to{transform:translateX(1140px)}}
  @keyframes run4{from{transform:translateX(-640px)}to{transform:translateX(1060px)}}
  @keyframes run5{from{transform:translateX(-820px)}to{transform:translateX(980px)}}
  @keyframes run6{from{transform:translateX(-1000px)}to{transform:translateX(900px)}}
  @keyframes run7{from{transform:translateX(-1180px)}to{transform:translateX(820px)}}
  @keyframes run8{from{transform:translateX(-1360px)}to{transform:translateX(740px)}}
 </style>
</defs>
<rect width="1200" height="500" rx="20" fill="url(#night)"/>
<path d="M0 426H1200" stroke="#42576a" stroke-width="4"/>
<path d="M0 436H1200" stroke="#172735" stroke-width="20"/>
<text x="42" y="42" class="small">$ ./naveen --late-night-mode</text>
<!-- standing figure: legs -->
<path d="M310 333l-5 91h68l8-92z" fill="#1266a2" class="ink"/>
<path d="M379 332l5 92h73l-13-100z" fill="#1266a2" class="ink"/>
<path d="M304 416h74q8 15-2 19h-83q-8-8 11-19zM384 416h75q16 12 5 20h-77z" fill="#151c25" class="ink"/>
<!-- body and collar -->
<path d="M287 164q44-31 104-13q53 13 81 67l30 130q-78 31-209 0l-20-120q-7-43 14-64z" fill="url(#shirt)" class="ink"/>
<path d="M327 151l34 31 34-31 19 35-30 27-23-12-25 12-29-28z" fill="#c0c0bc" class="ink"/>
<path d="M358 181l-10 240" stroke="#333b42" stroke-width="4" fill="none"/>
<!-- neck and head -->
<path d="M342 126h54v45q-22 22-54 0z" fill="#e9a02b" class="ink"/>
<path d="M291 69q5-57 66-61q65 0 83 56l-8 66q-9 43-66 49q-58-4-72-50z" fill="#f0a32e" class="ink"/>
<path d="M286 95q-15-58 35-83q57-29 104 10q28 24 21 78l-20-27-16-23-18 13-12-20-28 23-18-8-19 29z" fill="#252329" stroke="#252329" stroke-width="5"/>
<path d="M310 103q12 8 24 0m30 0q12 8 24 0" fill="none" stroke="#4a2c20" stroke-width="4" stroke-linecap="round"/>
<path d="M365 112l-4 17 12 3m-31 24q20-7 35 2" fill="none" stroke="#75482e" stroke-width="4" stroke-linecap="round"/>
<!-- left arm holding CLOSED laptop -->
<path d="M291 190q-39 30-52 89l-10 48" fill="none" stroke="#efa02d" stroke-width="23" stroke-linecap="round"/>
<path d="M225 321q-5 12 5 20" fill="none" stroke="#efa02d" stroke-width="18" stroke-linecap="round"/>
<g transform="translate(105 255) rotate(-8)">
 <rect x="0" y="0" width="125" height="155" rx="7" fill="#aeb8c4" stroke="#303944" stroke-width="5"/>
 <path d="M10 10h105v135H10z" fill="#c5cbd1" opacity=".25"/>
 <path d="M62 60c-9-11-26-7-25 8 1 15 25 28 25 28s24-13 25-28c1-15-16-19-25-8z" fill="#5b6672" transform="translate(0 8) scale(.72) translate(24 25)"/>
 <path d="M-8 156h141l-12 13H4z" fill="#7f8995" stroke="#303944" stroke-width="4"/>
</g>
<!-- right arm and cigarette animate as one connected limb -->
<g id="cigarm">
 <path d="M438 190q46 16 53 65l4 46" fill="none" stroke="#efa02d" stroke-width="23" stroke-linecap="round"/>
 <path d="M495 294q-2 12 9 17" fill="none" stroke="#efa02d" stroke-width="18" stroke-linecap="round"/>
 <g transform="translate(504 310) rotate(-68)">
  <rect x="-3" y="-20" width="6" height="42" rx="2" fill="#f5eee0" stroke="#6a4b3d" stroke-width="1"/>
  <rect x="-3" y="-20" width="6" height="9" fill="#d94b43"/>
  <circle cx="0" cy="-23" r="4" fill="#ff784d"/>
 </g>
</g>
<!-- smoke curls and messages -->
<g id="smoke1">
 <path d="M506 240q-25-24 2-43q23-17 4-37q-8-9 3-18" fill="none" stroke="#d5d9dc" stroke-width="4" opacity=".6" stroke-linecap="round"/>
 <text x="610" y="155" class="msg">Hii, I'm Naveen</text>
 <path d="M595 168q32-20 57-5" fill="none" stroke="#8be2b0" stroke-width="2" opacity=".8"/>
</g>
<g id="smoke2">
 <path d="M506 240q-25-24 2-43q23-17 4-37q-8-9 3-18" fill="none" stroke="#d5d9dc" stroke-width="4" opacity=".6" stroke-linecap="round"/>
 <text x="610" y="155" class="msg">I may be slow to reply</text>
 <path d="M595 168q32-20 57-5" fill="none" stroke="#8be2b0" stroke-width="2" opacity=".8"/>
</g>
<text x="610" y="205" class="small">OPEN SOURCE ENTHUSIAST</text>
<!-- exactly eight tiny rats running along the floor -->
<g class="r1" transform="translate(0 0)"><g transform="translate(0 414)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r2" transform="translate(0 0)"><g transform="translate(0 420) scale(.8)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r3" transform="translate(0 0)"><g transform="translate(0 413) scale(.9)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r4" transform="translate(0 0)"><g transform="translate(0 420) scale(.72)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r5" transform="translate(0 0)"><g transform="translate(0 415) scale(.85)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r6" transform="translate(0 0)"><g transform="translate(0 421) scale(.75)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r7" transform="translate(0 0)"><g transform="translate(0 414) scale(.92)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
<g class="r8" transform="translate(0 0)"><g transform="translate(0 420) scale(.78)"><ellipse class="rat" rx="15" ry="7"/><circle class="rat" cx="14" cy="-4" r="6"/><circle cx="17" cy="-5" r="1.4"/><path class="tail" d="M-14 1q-17-12-25-2"/><path d="M-5 5l-5 7m13-7 5 7" stroke="#c1c7cc" stroke-width="2"/></g></g>
</svg>